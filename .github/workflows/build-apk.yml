name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: cuentas-claras/frontend
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: cuentas-claras/frontend
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuentas-claras-apk
          path: cuentas-claras/frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Rename APK for Release
        if: startsWith(github.ref, 'refs/tags/')
        run: cp cuentas-claras/frontend/build/app/outputs/flutter-apk/app-release.apk cuentas-claras-${{ github.ref_name }}.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Cuentas Claras ${{ github.ref_name }} (Android)
          files: cuentas-claras-${{ github.ref_name }}.apk
          generate_release_notes: true
